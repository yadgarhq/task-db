{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. Each toggle below renders one kind today,
so the two counts happen to be equal here — they are not the same rule, and the
number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

EACH CHECK SITS BEHIND ITS OWN TOGGLE, AND THE TOGGLES ARE NOT OR-ED TOGETHER. An
adopter who creates the database and does not autoscale is refused for
mariadb-operator alone, and never for KEDA. `yadgarhq/platform` OR-s three toggles
into one check because all three render objects from the SAME group; these two
render objects from two groups that two different operators provide, so they are two
checks.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN, and here that needs no argument the way Envoy
Gateway's did in `yadgarhq/platform`: `k8s.mariadb.com/v1alpha1` is registered by
mariadb-operator and by nothing else, so there is no sibling specification a check
could name by mistake. The string is a LITERAL here because
`scripts/tests/test_render_checks.py` reads these arguments off the template to
count and exercise the checks; it is RECORDED a second time in `values.yaml` under
`database.mariadbOperator.apiVersion`, beside the toggle, and the gate that keeps
the two one is
`test_mariadb.py::test_the_render_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. A render check
may only ever sit behind a default-false toggle: `Has` is false for every CRD-backed
group with no cluster, so a check reachable at the defaults would refuse every
offline render in the estate.
*/}}
{{/*
THE SHAPE OF `database.create`, REFUSED BEFORE ANY TOGGLE READS IT.

DECLARED FIRST IN THIS FILE, AND THAT IS THE POINT. Everything below this block, and
`templates/mariadb.yaml` beside it, gates on `{{ if .Values.database.create }}` — a
BARE TRUTHINESS TEST, which is FAIL-OPEN on a string. Measured on helm 3.20.2 and
4.3.0, identically, over ten writable shapes:

  false, 0, null, {}, []   render no MariaDB
  true                     renders one
  "false", "no", "true", 1 render one

So `database.create: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
DATABASE ENGINE. `{}` additionally draws a coalesce warning on both helm lines and
still resolves falsy, so the two shapes an adopter is most likely to write are the
two that say least about what they did.

ADR-0797 IS THE GOVERNING RULE: a values key a helm condition reads, and that some
chart in the tree DECLARES, is validated with `kindIs "bool"` ON THE RAW VALUE. Not
`hasKey` alone — `{}` is present and is not a toggle. Not `kindIs "map"` — that is
ADR-0794's rule for a key whose value is a BLOCK, and this one's value is a bool.
Never on the result of a `default`: sprig's `default` substitutes on an EMPTY value,
so `false`, `0`, `""` and `[]` all collapse into the default and the kind test then
covers exactly the non-empty scalars.

`hasKey` COMES FIRST BECAUSE `kindOf` CANNOT TELL A DELETED KEY FROM AN ABSENT ONE —
it answers `invalid` for both. The distinction is load-bearing here, and it is
MEASURED rather than assumed: helm DELETES a null-valued key when some chart in the
tree declares it, and restores no default. This chart's own `values.yaml` declares
`database.create: false`, so a values file that OMITS the key gets that default back
and `hasKey` is true. `hasKey` is false only when a values file wrote `create:` with
NO VALUE and helm deleted it — the one shape where the chart's default does not
apply and nothing warns. THAT is why an absent key REFUSES here rather than
defaulting false: the absence is not an adopter leaving the key alone, it is an
adopter having written something helm threw away.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794). A refusal and
a raise both exit 1, so the only thing that tells them apart is the message — and a
refusal that quotes one of go/template's own error markers makes an assertion of the
form "the raise marker is not in this message" false-green for ever.
`scripts/tests/test_render_checks.py::test_the_shape_refusal_does_not_quote_a_raise`
holds the banned markers, in one place, and reads this whole file for them; the
eleven-shape table beside it is the gate on this block.
*/}}
{{- if not (hasKey .Values "database") }}
{{- fail (join "" (list
      "task-db: `database` is absent from the values, so `database.create` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `database:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `database` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (hasKey .Values.database "create") }}
{{- fail (join "" (list
      "task-db: `database.create` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `create:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `database.create: "
      "false` to leave the MariaDB instance uncreated, or `true` to create it.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.database.create) }}
{{- fail (printf (join "" (list
      "task-db: `database.create` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a MariaDB instance while {}, 0 and [] do not, and "
      "nothing tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.database.create) (toJson .Values.database.create)) }}
{{- end }}
{{- if .Values.database.create }}
{{- include "task-db.require-api" (dict
      "context" $
      "apiVersion" "k8s.mariadb.com/v1alpha1"
      "operator" "mariadb-operator"
      "toggle" "database.create") }}
{{- end }}

{{/*
KEDA, BEHIND THE TOGGLE THAT RENDERS THE ScaledObject.

`autoscaling.enabled` renders `templates/scaledobject.yaml`, whose one kind is
`keda.sh/v1alpha1/ScaledObject`. Without this check an adopter who turns autoscaling
on against a cluster with no KEDA renders cleanly and then fails at apply with `no
matches for kind ScaledObject`, half-way through an install — the pod and the Service
applied, the autoscaler absent, and the message naming a kind rather than the
operator to install.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification this could name by mistake — the
argument `yadgarhq/platform`'s Envoy Gateway check has to make, and which does not
arise here. `ScaledObject` is the only kind of that group this chart renders; KEDA
serves five more, and a chart that later renders one of them is covered by this same
check, because the rule is one check per OPERATOR.

NO GATEWAY API CHECK IS ADDED BESIDE IT, and that is a decision rather than an
omission. This chart renders no Gateway API object at all, and the estate's
`gateway.enabled` is the one toggle that defaults TRUE — a render check behind a
default-true toggle refuses every offline render in the estate, which is the exact
failure the opt-in rule below exists to prevent.

THE STRING IS A LITERAL HERE AND IS RECORDED IN `values.yaml` UNDER
`autoscaling.kedaOperator.apiVersion`, read off KEDA as the estate pins it. It has to
be a literal because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; the gate that keeps the two one is
`test_every_declared_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. `autoscaling.enabled`
defaults false, for the same reason `database.create` does.
*/}}
{{/*
THE SHAPE OF `autoscaling.enabled`, REFUSED BEFORE THE KEDA CHECK CAN READ IT (ledger
1135, ADR-0850).

`templates/scaledobject.yaml` gates on `{{ if .Values.autoscaling.enabled }}` — a BARE
TRUTHINESS TEST, which is FAIL-OPEN on a string exactly like `database.create` above:
`autoscaling.enabled: "false"` reads as OFF to any human and renders a ScaledObject.
ADR-0850 amends ADR-0797's scope from dependency-condition keys to every boolean
toggle a template reads, so this toggle gets the same two-part guard: `hasKey` before
`kindIs`, because `kindOf` answers `invalid` for a deleted key and for an absent one
alike and cannot tell them apart.

`autoscaling` ITSELF IS GUARDED FIRST, AND THAT ARM IS ADR-0794's IDIOM — `hasKey`
then `kindIs "map"` on the raw value — because `minReplicas`, `maxReplicas`,
`threshold` and `prometheusAddress` all live under it too: a non-map `autoscaling`
(`autoscaling: "x"`) is refused by name here rather than raising a bare Go template
error the first place something under it is read.

ADR-0850'S OTHER HALF LIVES IN `templates/scaledobject.yaml`, NOT HERE. Helm renders
that template before this one, so a `fail` here cannot pre-empt a raise `.Values.
autoscaling.enabled` throws there first when `autoscaling` is not a map. That template
carries its own `kindIs "map"` guard on the same read for that reason — the refusal
below is reached only once that guard has already kept the read safe.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "task-db: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot "
      "be read. Helm deletes a null-valued key that a chart in the tree declares, and "
      "restores no default, so a values file writing `autoscaling:` with no value leaves "
      "this chart with nothing under it. Write the keys you mean, or omit `autoscaling` "
      "entirely and this chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "task-db: `autoscaling` must be a map and is %s (%s). `enabled`, `minReplicas`, "
      "`maxReplicas`, `threshold` and `prometheusAddress` all live under it, so a "
      "string, number or list here cannot be read. Write the block this chart's "
      "`values.yaml` declares."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (hasKey .Values.autoscaling "enabled") }}
{{- fail (join "" (list
      "task-db: `autoscaling.enabled` is absent. This chart's `values.yaml` declares it "
      "false, so it is missing only when a values file wrote `enabled:` with NO VALUE — "
      "helm deletes a null-valued key a chart declares and restores no default. Write "
      "`autoscaling.enabled: false` to leave autoscaling off, or `true` to turn it on.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) }}
{{- fail (printf (join "" (list
      "task-db: `autoscaling.enabled` must be true or false and is %s (%s). A string, "
      "number, map or list here is not a toggle: the template gates on bare truthiness, "
      "so \"false\", \"no\", \"true\" and 1 all TURN AUTOSCALING ON while {}, 0 and [] do "
      "not, and nothing tells you which one you wrote. Write the bare word `true` or "
      "`false`."))
      (kindOf .Values.autoscaling.enabled) (toJson .Values.autoscaling.enabled)) }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- include "task-db.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}

{{/*
THE SHAPE OF `tls.enabled`, REFUSED BEFORE `templates/deployment.yaml` CAN RENDER
IT (ADR-0845, C-DB1).

`templates/deployment.yaml` now renders `LISTEN_TLS_ENABLED` UNCONDITIONALLY —
ADR-0845 deleted the binary's compiled-in default, so the chart can no longer skip
the variable when TLS is "off"; it must always say which one it means, as
`ternary "1" "0" .Values.tls.enabled`. A BARE `.Values.tls.enabled` read is
FAIL-OPEN on a string exactly as `autoscaling.enabled` and `database.create`
above: `tls.enabled: "false"` reads as off to any human, and under Go template
truthiness a non-empty string is truthy, so `ternary` would hand the pod
LISTEN_TLS_ENABLED="1" for a value every reader believes turned TLS off. ADR-0850
is the same two-part guard every other toggle here carries: `hasKey` before
`kindIs`, because `kindOf` answers `invalid` for a deleted key and for an absent
one alike and cannot tell them apart.

`tls` ITSELF IS GUARDED FIRST, the same `hasKey` then `kindIs "map"` idiom as
`autoscaling`: `certSecret`, `certSecretKey`, `keySecretKey`, `clientAuth`,
`clientCaSecret` and `clientCaSecretKey` all live under it too.

`templates/deployment.yaml` CARRIES ITS OWN `kindIs "map"` GUARD on the same
read, the same defence `templates/scaledobject.yaml` carries for
`autoscaling.enabled` — the refusal below is reached only once that guard has
already kept the read safe, whichever of the two templates helm reaches first.

UNLIKE `database.create` AND `autoscaling.enabled`, THIS GUARD HAS NO TRAILING
`include "task-db.require-api"`: TLS needs no CRD-backed operator at render
time, only a Secret, so there is no API-availability check to chain after the
shape is proved sound.
*/}}
{{- if not (hasKey .Values "tls") }}
{{- fail (join "" (list
      "task-db: `tls` is absent from the values, so `tls.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and "
      "restores no default, so a values file writing `tls:` with no value leaves "
      "this chart with nothing under it. Write the keys you mean: `tls.enabled` "
      "has no default (ADR-0845) and must be `true` or `false`.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.tls) }}
{{- fail (printf (join "" (list
      "task-db: `tls` must be a map and is %s (%s). `enabled`, `certSecret`, "
      "`certSecretKey` and `keySecretKey` all live under it, so a string, number "
      "or list here cannot be read. Write the block this chart's `values.yaml` "
      "declares."))
      (kindOf .Values.tls) (toJson .Values.tls)) }}
{{- end }}
{{- if not (hasKey .Values.tls "enabled") }}
{{- fail (join "" (list
      "task-db: `tls.enabled` is absent. ADR-0845 gives this knob no compiled-in "
      "default: an absent or nulled value is a choice this chart cannot make for "
      "an adopter. Write `tls.enabled: true` to serve this listener over TLS, or "
      "`false` to leave it in cleartext.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.tls.enabled) }}
{{- fail (printf (join "" (list
      "task-db: `tls.enabled` must be true or false and is %s (%s). A string, "
      "number, map or list here is not a toggle: the chart renders "
      "LISTEN_TLS_ENABLED from it unconditionally, so a quoted or typed value is "
      "misread rather than refused until the pod either fails to boot or serves "
      "the wrong transport. Write the bare word `true` or `false`."))
      (kindOf .Values.tls.enabled) (toJson .Values.tls.enabled)) }}
{{- end }}

{{/*
B-U5 CONTRACT: `tls.clientAuth` IS REQUIRED (ADR-0854, X-ADR-1, K-1 guard shape).

THE BINARY READS LISTEN_TLS_CLIENT_AUTH NOW, through
`yadgar_lifecycle::serve_tls`, and refuses to boot without it WHETHER OR NOT TLS
IS ON — deleting the variable is a boot refusal, never a way to turn
verification off. So the chart has no default for the value that renders it:
an absent key is refused here, by name, rather than rendering a pod that
crashloops. `chart/values.schema.json` also lists the key under `required` and
an `enum`, which refuse the absent, bare-`off` and unknown shapes first on this
chart (K-3); these arms hold for a values source that schema does not see first.

THE B-U5E EXPAND'S "not enforced" REFUSAL OF `optional` AND `required`
IS LIFTED (K-8 step 3): the binary verifies a caller's certificate against
LISTEN_TLS_CLIENT_CA_FILE in both modes. Two refusals take its place, each the
render-time twin of a boot refusal the binary would otherwise raise in a
crashloop: a verifying mode on a cleartext listener (`ClientAuthWithoutTls`),
and a verifying mode with no `tls.clientCaSecret` to verify against
(`NoClientCaFile`).

THE STRING GUARD COMES FIRST, BEFORE ANY `eq`, and is load-bearing rather than
cosmetic: YAML 1.1 reads a bare, unquoted `off` as the boolean `false`
(`clientAuth: off` parses to `false`, not the string `"off"`), and `eq false
"optional"` is a Go template TYPE ERROR — "incompatible types for comparison" —
raised as a bare raise rather than refused by name. `kindIs "string"` catches
that shape before any `eq` is reached, naming the mistake an adopter who wrote
the unquoted word actually made.

THE WHOLE BLOCK IS NESTED UNDER `kindIs "map"`: `helm lint` logs a `fail` as
INFO and keeps evaluating, so the `tls`-not-a-map arm above does not stop a
`hasKey` on a string from raising here.
*/}}
{{- if kindIs "map" .Values.tls }}
{{- if not (hasKey .Values.tls "clientAuth") }}
{{- fail (join "" (list
      "task-db: `tls.clientAuth` is absent. It renders LISTEN_TLS_CLIENT_AUTH, "
      "which this binary reads with no default (ADR-0854) and refuses to boot "
      "without, whether or not TLS is on. Write the keys you mean: "
      "`tls.clientAuth` has no default and must be \"off\", \"optional\" or "
      "\"required\" — quoted, because YAML reads a bare off as false.")) }}
{{- end }}
{{- if not (kindIs "string" .Values.tls.clientAuth) }}
{{- fail (printf (join "" (list
      "task-db: `tls.clientAuth` must be a quoted string (\"off\", \"optional\" or "
      "\"required\") and is %s (%s). YAML reads a bare `off` as false: write "
      "`clientAuth: \"off\"`."))
      (kindOf .Values.tls.clientAuth) (toJson .Values.tls.clientAuth)) }}
{{- end }}
{{- if kindIs "string" .Values.tls.clientAuth }}
{{- if not (has .Values.tls.clientAuth (list "off" "optional" "required")) }}
{{- fail (printf (join "" (list
      "task-db: `tls.clientAuth` must be `off`, `optional` or `required` "
      "(ADR-0854) and is %s. `off` verifies no caller; `optional` verifies a "
      "presented certificate; `required` refuses a caller without one."))
      (toJson .Values.tls.clientAuth)) }}
{{- end }}
{{- if ne .Values.tls.clientAuth "off" }}
{{- if not .Values.tls.enabled }}
{{- fail (printf (join "" (list
      "task-db: `tls.clientAuth: %s` "
      "verifies client certificates, so `tls.enabled` must be true: "
      "a cleartext listener cannot verify one, and the binary "
      "refuses to boot on that pair (ADR-0854). Set `tls.enabled: true`, or "
      "`tls.clientAuth: \"off\"`."))
      .Values.tls.clientAuth) }}
{{- end }}
{{- if not .Values.tls.clientCaSecret }}
{{- fail (printf (join "" (list
      "task-db: `tls.clientAuth: %s` "
      "verifies client certificates against `tls.clientCaSecret`, "
      "which names no Secret. Without it the chart renders "
      "no LISTEN_TLS_CLIENT_CA_FILE and the binary refuses to boot (ADR-0854). "
      "Set `tls.clientCaSecret` (and `tls.clientCaSecretKey`) to the authority "
      "that signs your callers' certificates, or `tls.clientAuth: \"off\"`."))
      .Values.tls.clientAuth) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
