[package]
name = "yadgar-task-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The task module's -db twin: the only writer of its store, serving TaskDbService over gRPC."

[dependencies]
# Pinned by RELEASE TAG, not by branch. store now publishes versions, and a
# published tag never moves in this organisation — a correction is a new tag —
# so `v0.1.0` names exactly one commit for as long as it exists, and Cargo.lock
# records the revision it resolved to. A branch is the moving target this
# refuses, the same reasoning that pins images by digest (D61) and actions by
# SHA (D62). Bumped deliberately, never drifting underneath a build.
yadgar-store = { git = "https://github.com/yadgarhq/store.git", tag = "v0.1.0" }
# In tonic 0.14 prost codegen moved out to tonic-prost; there is no "prost"
# feature on tonic itself.
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "router",
  "server",
  "transport",
  # `tls-ring`, NOT `tls-aws-lc`. aws-lc-rs needs cmake and a C toolchain, and
  # this binary builds for x86_64-unknown-linux-musl (D63). It is also the
  # provider sqlx already uses here — `tls-rustls-ring` below — so there is one
  # crypto provider in this tree rather than two.
  #
  # It adds no crate: `ring` has been in the lock file since sqlx arrived. This
  # module served plain HTTP/2 until now because nothing in the estate could
  # speak TLS to it; the flag is opt-in and off, so it still does by default.
  "tls-ring",
] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# The shared instrumentation seam (D67), pinned by release tag like every in-org crate.
yadgar-telemetry = { git = "https://github.com/yadgarhq/telemetry.git", tag = "v0.1.0", features = ["grpc"] }
sqlx = { version = "0.9", default-features = false, features = [
  "json",
  "runtime-tokio",
  "tls-rustls-ring",
  "mysql",
  "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
# D9's differing-payload refusal compares a digest of the prior REQUEST, so the
# digest has to be one a caller cannot collide. A non-cryptographic hash is
# cheaper and its collision is the exact lie the rule exists to stop: two
# different requests fingerprinting alike are replayed, and the caller is told a
# request nobody performed succeeded. Already in the tree transitively via
# rustls; named here because this module now depends on it directly.
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `tests/serve_tls.rs` proves the serving transport with REAL handshakes, so it
# needs a gRPC CLIENT to handshake with — which the shipped binary has no use
# for, since this module only ever answers. A dev-dependency's features do not
# reach anything that links this crate, so the shipped tree is unchanged.
tonic = { version = "0.14", default-features = false, features = ["channel"] }
# `TcpListenerStream` is what lets a listener be BOUND before it is served:
# picking a port and reopening it leaves a window in which something else can
# take it, and the rig binds one port on two addresses. Already in the lock file
# by way of tokio, so this adds no crate to the dependency graph.
tokio-stream = { version = "0.1", features = ["net"] }
# Certificates are MINTED PER RUN rather than checked in: a fixture key in the
# repository is a secret in the repository, and it expires on a date nobody is
# watching. Same crate and same features yadgar-dial uses for the client half of
# this seam.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
