# Every yadgarhq repo carries pre-commit (D59). Hook failure is signal, not
# obstacle: fix the cause and re-stage. Never --no-verify.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Helm templates are Go templates that HAPPEN to look like YAML —
        # `{{- toYaml ... }}` is a syntax error to any real parser. Excluding
        # them is not lowering the bar: `helm lint` and `helm template` are the
        # checks that actually apply, and they run in CI.
        exclude: ^chart/templates/
      - id: check-toml

  # Shared, from yadgarhq/actions (D62). IMMUTABLE rev: pre-commit caches a rev
  # at first install and never re-resolves it, so a moving tag would silently
  # freeze each machine at whatever it meant the day it first ran.
  - repo: https://github.com/yadgarhq/actions
    rev: v1.18.3
    hooks:
      - id: gitleaks
      - id: prettier
        exclude: ^(chart/templates/|proto/)
      - id: hadolint
      # Every repository here carries workflows, and until this hook was
      # published nothing linted them. It REFUSES rather than passes when
      # actionlint's shellcheck rule class is not running: actionlint silently
      # disables that whole class when the binary is absent, and "Passed, having
      # checked nothing" is the defect the guard closes.
      - id: actionlint
      - id: cargo-fmt
      - id: cargo-clippy
      # LEDGER 659, and the rev above moves to v1.18.3 FOR THESE TWO. The
      # `complexity` script gained its `tests.rs` exemption in actions#69, which
      # only v1.18.3 carries. The v1.18.2..v1.18.3 diff touches
      # `hooks/complexity.py` and its own test file and nothing else, so no
      # other hook's behaviour moves with the bump.
      #
      # THE BUMP IS NOT WHAT MAKES THIS TREE PASS, and saying so would be
      # untrue: v1.18.2's script, run over this tree, also exits 0. It passes by
      # ACCIDENT — under v1.18.2 the two `src/<mod>/tests.rs` files here are
      # measured as production code, and they clear the ceiling only because
      # they happen to be 483 and 443 lines. EIGHTEEN more test lines in
      # `src/boot/tests.rs` and v1.18.2 would refuse a test module, which is the
      # outcome actions#69 exists to prevent. v1.18.3 is what makes the layout
      # the gate's own docstring recommends actually safe to adopt.
      #
      # ADOPTED HERE BECAUSE THIS REPOSITORY IS NOW CLEAN, measured rather than
      # hoped. Before this PR `complexity.py` reported three files over the
      # 500-line ceiling (boot.rs 996, setting.rs 667, write.rs 563) and two
      # functions over 120 (`main` 231, `update` 134) — the same 3-and-2 the
      # estate-wide measurement recorded for this repository. It now reports
      # nothing, and `cargo clippy --all-targets --all-features -- -W
      # clippy::cognitive_complexity -W clippy::too_many_arguments -D warnings`
      # exited 0 both before and after, so `cargo-clippy-complexity` is adopted
      # having never been breached here.
      #
      # A published hook nobody references gates nothing (ADR-0577), and these
      # two were referenced by one repository in the estate until ledger 659.
      # The two are complementary and neither replaces the other: a line count
      # cannot see nesting, and cognitive complexity cannot see a 2000-line file
      # of short functions.
      - id: complexity
      - id: cargo-clippy-complexity
      - id: cargo-deny
      - id: observe-coverage
      - id: helm-lint
      # ADR-0569's gate (ledger 648), now shared instead of the byte-identical
      # copy this repository carried at scripts/no_compiled_in_defaults.sh.
      # Publishing let the sweep run against repositories the copy never
      # covered; converting this repository's OWN reference changes no verdict
      # here (see PR body).
      - id: no-compiled-in-defaults
      # LEDGER 658. Adopted though it checks nothing today: the largest `run:`
      # block outside yadgarhq/actions is 303 bytes against an 8000-byte limit,
      # and this repository measures 0. It is a tripwire for a block someone
      # writes later, not a fix for anything present now.
      - id: run-block-size
      # LEDGER 734, adopting ledger 726's gate: a file read at boot is marked
      # ADR-0523-WATCHED naming a src/rotate.rs material, or ADR-0523-UNWATCHED
      # with a reason. This repository had never run it before this PR.
      - id: boot-reads-watched
